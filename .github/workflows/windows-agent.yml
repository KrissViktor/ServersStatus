name: Build Windows agent
on:
  push:
    paths: ['agent/**', '.github/workflows/windows-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r agent/requirements-windows.txt pyinstaller==6.16.0
      - name: Test backup schedules
        run: python -m unittest discover -s tests -p test_backups.py -v
      - name: Build standalone service
        run: python -m PyInstaller --noconfirm --clean --onefile --name ServersStatusService --hidden-import win32timezone --paths . agent/windows_service.py
      - name: Test frozen service registration and startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = "$env:ProgramData\ServersStatus"
          New-Item -ItemType Directory -Force $data | Out-Null
          Copy-Item agent/config.example.json "$data\config.json"
          & dist/ServersStatusService.exe --startup auto install
          if ($LASTEXITCODE -ne 0) { throw 'Service install failed' }
          try {
            & dist/ServersStatusService.exe start
            if ($LASTEXITCODE -ne 0) { throw 'Service start failed' }
            Start-Sleep -Seconds 8
            if ((Get-Service ServersStatusAgent).Status -ne 'Running') { throw 'Service not running' }
          } finally {
            & dist/ServersStatusService.exe stop
            Start-Sleep -Seconds 3
            & dist/ServersStatusService.exe remove
          }
      - name: Build graphical installer
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ServersStatusSetup --add-binary "dist/ServersStatusService.exe;." agent/installer.py
      - name: Checksums
        shell: pwsh
        run: |
          (Get-FileHash dist/ServersStatusSetup.exe -Algorithm SHA256).Hash + '  ServersStatusSetup.exe' | Set-Content dist/SHA256SUMS.txt
      - name: Stage backup host update files
        shell: pwsh
        run: Copy-Item agent/backups.WIN-CU629F0N7II.json, agent/Update-BackupAgent.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ServersStatus-Windows-x64
          path: |
            dist/ServersStatusSetup.exe
            dist/ServersStatusService.exe
            dist/backups.WIN-CU629F0N7II.json
            dist/Update-BackupAgent.ps1
            dist/SHA256SUMS.txt
          if-no-files-found: error
