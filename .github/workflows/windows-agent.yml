name: Build Windows agent
on:
  push:
    paths: ['agent/**', '.github/workflows/windows-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r agent/requirements-windows.txt pyinstaller==6.16.0
      - name: Test backup schedules
        run: python -m unittest discover -s tests -p test_backups.py -v
      - name: Test extended metrics
        run: python -m unittest discover -s tests -p test_metrics.py -v
      - name: Test universal updater
        run: python -m unittest discover -s tests -p test_updater.py -v
      - name: Test remote monitoring settings
        run: python -m unittest discover -s tests -p test_settings.py -v
      - name: Test Windows inventory
        run: python -m unittest discover -s tests -p test_windows_inventory.py -v
      - name: Test process inventory and RDP details
        run: python -m unittest discover -s tests -p test_process_inventory.py -v
      - name: Test Windows management inventory and commands
        run: python -m unittest discover -s tests -p test_windows_management_agent.py -v
      - name: Test remote console engine
        run: python -m unittest discover -s tests -p test_console_agent.py -v
      - name: Stamp agent version
        shell: pwsh
        run: |
          $version = git rev-parse --short=12 HEAD
          [System.IO.File]::WriteAllText("$PWD/agent/VERSION", $version)
          New-Item -ItemType Directory -Force dist | Out-Null
          [System.IO.File]::WriteAllText("$PWD/dist/VERSION.txt", $version)
      - name: Validate update helper PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/agent/apply_update.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/agent/windows_management.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/agent/Enable-WindowsManagement.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/agent/Enable-RemoteConsole.ps1", [ref]$parseTokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
      - name: Test real Windows helper file replacement and rollback
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/Test-WindowsUpdateHelper.ps1
      - name: Build standalone service
        run: python -m PyInstaller --noconfirm --clean --onefile --name ServersStatusService --add-data "agent/VERSION;agent" --add-data "agent/apply_update.ps1;agent" --add-data "agent/windows_management.ps1;agent" --hidden-import win32timezone --hidden-import win32ts --paths . agent/windows_service.py
      - name: Test frozen service registration and startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $data = "$env:ProgramData\ServersStatus"
          New-Item -ItemType Directory -Force $data | Out-Null
          Copy-Item agent/config.example.json "$data\config.json"
          $installed = "$env:ProgramFiles\ServersStatus\ServersStatusService.exe"
          New-Item -ItemType Directory -Force (Split-Path $installed) | Out-Null
          Copy-Item dist/ServersStatusService.exe $installed
          & $installed --startup auto install
          if ($LASTEXITCODE -ne 0) { throw 'Service install failed' }
          try {
            & $installed start
            if ($LASTEXITCODE -ne 0) { throw 'Service start failed' }
            Start-Sleep -Seconds 8
            if ((Get-Service ServersStatusAgent).Status -ne 'Running') { throw 'Service not running' }
            $hash = (Get-FileHash dist/ServersStatusService.exe -Algorithm SHA256).Hash
            & agent/apply_update.ps1 -Package "$PWD/dist/ServersStatusService.exe" -Sha256 $hash
            if ((Get-Service ServersStatusAgent).Status -ne 'Running') { throw 'Frozen self-update smoke failed' }
          } finally {
            & $installed stop
            Start-Sleep -Seconds 3
            & $installed remove
          }
      - name: Build graphical installer
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name ServersStatusSetup --paths . --add-binary "dist/ServersStatusService.exe;." agent/installer.py
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/ServersStatus*.exe | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $_.Name } | Set-Content dist/SHA256SUMS.txt
      - name: Stage backup host update files
        shell: pwsh
        run: Copy-Item agent/backups.WIN-CU629F0N7II.json, agent/Update-BackupAgent.ps1, agent/Update-Agent.ps1, agent/Enable-WindowsManagement.ps1, agent/apply_update.ps1, agent/Repair-WindowsAgent.ps1, agent/Enable-RemoteConsole.ps1 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ServersStatus-Windows-x64
          path: |
            dist/ServersStatusSetup.exe
            dist/ServersStatusService.exe
            dist/Update-Agent.ps1
            dist/apply_update.ps1
            dist/Repair-WindowsAgent.ps1
            dist/Enable-WindowsManagement.ps1
            dist/Enable-RemoteConsole.ps1
            dist/SHA256SUMS.txt
            dist/VERSION.txt
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: Backup-rules-WIN-CU629F0N7II
          path: |
            dist/backups.WIN-CU629F0N7II.json
            dist/Update-BackupAgent.ps1
          if-no-files-found: error

      - name: Publish public GitHub release
        if: github.ref == 'refs/heads/main' && github.repository == 'KrissViktor/ServersStatus'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content dist/VERSION.txt -Raw).Trim()
          python -m agent.release_manifest windows-x64 $version dist/ServersStatusService.exe dist/update-windows.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest generation failed' }
          python -m agent.publish_release dist/update-windows.json dist/ServersStatusService.exe
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
