name: Test Linux agent
on:
  push:
    paths: ['agent/**', 'server/**', 'tests/**', 'deploy/serversstatus-linux-agent.service', 'deploy/LINUX.md', 'deploy/upgrade-portal-python.sh', 'requirements*.txt', '.github/workflows/linux-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-agent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python 3.11 syntax
        run: python -m compileall -q server agent tests
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - name: Collect live Linux report
        run: |
          python - <<'PY'
          from agent.client import collect
          from server.app import Report
          data=collect({}, {})
          Report.model_validate(data)
          assert data['system']['os']=='Linux'
          assert data['system']['memory_used_bytes']>=0
          assert data['disks']
          print('Live Linux report validated')
          PY
      - name: Package Linux source agent
        run: |
          mkdir -p dist
          git rev-parse --short=12 HEAD > agent/VERSION
          cp agent/VERSION dist/VERSION.txt
          tar --exclude='*/__pycache__' --exclude='*.pyc' --exclude='agent/config.json*' --exclude='agent/agent.log*' -czf dist/ServersStatus-Linux.tar.gz agent deploy/serversstatus-linux-agent.service deploy/LINUX.md
          sha256sum dist/ServersStatus-Linux.tar.gz > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ServersStatus-Linux-Python311
          path: dist/*

      - name: Publish public GitHub release
        if: github.ref == 'refs/heads/main' && github.repository == 'KrissViktor/ServersStatus'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m agent.release_manifest linux-source "$(cat dist/VERSION.txt)" dist/ServersStatus-Linux.tar.gz dist/update-linux.json
          python -m agent.publish_release dist/update-linux.json dist/ServersStatus-Linux.tar.gz

  portal-python313:
    name: Проверка портала на Python 3.13
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m compileall -q server agent tests
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/chart_geometry.test.js
      - run: bash -n deploy/upgrade-portal-python.sh
